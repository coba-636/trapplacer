name: Release

# Builds the mod and publishes the jar as a GitHub release named after mod_version
# in gradle.properties (e.g. v1.0.0). Run it from the Actions tab, or push a v* tag.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          ./gradlew build --no-daemon
          rm build/libs/*-sources.jar

      - name: Read version
        id: version
        run: echo "tag=v$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Trap Placer ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.tag }}
          files: build/libs/trapplacer-*.jar
          body: |
            Trap Placer for **Minecraft 1.21.11** (Fabric).

            Place fully built, working traps in about two seconds: Front Door Drop, Loot Chest Trap,
            Crafting Table Trap, Sweet Dreams Bed Trap, Fake Diamond Mine, Powder Snow Pit and a
            One-Shot Arrow Railgun.

            **Install:** put the jar below and [Fabric API](https://modrinth.com/mod/fabric-api) in your
            `mods` folder (Fabric Loader 0.19.5+). Servers and players both need it.

            See the [README](https://github.com/${{ github.repository }}#readme) for how to use it.
